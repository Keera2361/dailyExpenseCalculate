<!DOCTYPE html>
<html>
<head>
    <title>Daily Expense Tracker</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

        <div class="container">

            <div style="display:flex;align-items:center;justify-content:space-between;">
                <div style="display:flex;align-items:center;gap:12px;">
                    <img id="userIcon" src="https://cdn-icons-png.flaticon.com/512/7736/7736928.png" alt="icon" style="width:40px;height:40px;border-radius:6px;">
                    <h1 style="margin:0;">Daily Expense Tracker</h1>
                </div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <div id="userGreeting" style="font-weight:600;color:#0b1220;"></div>
                    <button class="btn btn-green logout" onclick="logout()">Logout</button>
                </div>
            </div>

                        <div class="form">
                                <input type="text" id="item" placeholder="Item Name">
                                <input type="number" id="amount" placeholder="Amount">
                                <label style="display:inline-block;margin-left:8px;">
                                    <input type="checkbox" id="useDate"> Use custom date
                                </label>
                                <input type="date" id="date" placeholder="Date (optional)" style="margin-left:8px; display:none;">
                            <button class="btn btn-green" onclick="addExpense()">Add Expense</button>
                            <button id="showAllBtn" class="btn btn-green" style="margin-left:8px;">Show All</button>
                        </div>

                        <div id="filterLabel" style="margin-top:8px;color:#0b1220;font-weight:600;"></div>

            

            <ul id="expenseList"></ul>

            <h3>Total Today: ₹<span id="total">0</span></h3>

            <h2>Expense Chart</h2>

            <canvas id="expenseChart"></canvas>

        </div>
            <!-- Loading overlay shown during async operations -->
            <div id="loadingOverlay" aria-hidden="true" style="display:none;">
                <div class="spinner" role="status" aria-label="Loading"></div>
            </div>

            <script src="script.js"></script>
    </body>
</html>
