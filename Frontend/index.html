<!DOCTYPE html>
<html>
<head>
    <title>Daily Expense Tracker</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

        <div class="container">

            <button class="btn btn-green logout" onclick="logout()">Logout</button>

            <h1>Daily Expense Tracker</h1>

                        <div class="form">
                                <input type="text" id="item" placeholder="Item Name">
                                <input type="number" id="amount" placeholder="Amount">
                                <label style="display:inline-block;margin-left:8px;">
                                    <input type="checkbox" id="useDate"> Use custom date
                                </label>
                                <input type="date" id="date" placeholder="Date (optional)" style="margin-left:8px; display:none;">
                            <button class="btn btn-green" onclick="addExpense()">Add Expense</button>
                            <button id="showAllBtn" class="btn btn-green" style="margin-left:8px;">Show All</button>
                        </div>

                        <div id="filterLabel" style="margin-top:8px;color:#0b1220;font-weight:600;"></div>

            

            <ul id="expenseList"></ul>

            <h3>Total Today: ₹<span id="total">0</span></h3>

            <h2>Expense Chart</h2>

            <canvas id="expenseChart"></canvas>

        </div>

        <script src="script.js"></script>
    </body>
</html>
