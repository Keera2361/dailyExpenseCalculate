<!DOCTYPE html>
<html>
<head>
    <title>Daily Expense Tracker</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

        <div class="container">

            <button class="logout" onclick="logout()">Logout</button>

            <h1>Daily Expense Tracker</h1>

                        <div class="form">
                                <input type="text" id="item" placeholder="Item Name">
                                <input type="number" id="amount" placeholder="Amount">
                                <label style="display:inline-block;margin-left:8px;">
                                    <input type="checkbox" id="useDate"> Use custom date
                                </label>
                                <input type="date" id="date" placeholder="Date (optional)" style="margin-left:8px; display:none;">
                                <button onclick="addExpense()">Add Expense</button>
                        </div>

            <h2>Today's Expenses</h2>

            <ul id="expenseList"></ul>

            <h3>Total Today: ₹<span id="total">0</span></h3>

            <h2>Expense Chart</h2>

            <canvas id="expenseChart"></canvas>

        </div>

        <script src="script.js"></script>
    </body>
</html>
