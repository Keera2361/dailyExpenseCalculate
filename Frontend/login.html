<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Login</h1>

<input type="email" id="email" placeholder="Email">

<div style="position:relative; width:100%;">
	<input type="password" id="password" placeholder="Password">
	<button type="button" class="password-toggle" onclick="togglePassword('password', this)">Show</button>
</div>


    <div id="authMessage" class="auth-message" style="display:none"></div>

<button class="btn btn-green" onclick="login()">Login</button>

<a class="link" href="register.html">Create new account</a>

</div>

<!-- Loading overlay -->
<div id="loadingOverlay" aria-hidden="true" style="display:none;">
	<div class="spinner" role="status" aria-label="Loading"></div>
</div>

<script src="auth.js"></script>

</body>
</html>
