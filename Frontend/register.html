<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Create Account</h1>

<input type="text" id="name" placeholder="Name">
<input type="email" id="email" placeholder="Email">
<div style="position:relative; width:100%;">
	<input type="password" id="password" placeholder="Password">
	<button type="button" class="password-toggle" onclick="togglePassword('password', this)">Show</button>
</div>

<button class="btn btn-green" onclick="register()">Register</button>

<a class="link" href="login.html">Already have account? Login</a>

</div>

<script src="auth.js"></script>

</body>
</html>
